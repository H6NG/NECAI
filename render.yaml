# Backend only. The frontend is a Static Site configured manually in the
# Render dashboard (Root Directory: frontend, publish: dist) — deliberately
# not declared here, so a Blueprint sync won't create a duplicate of it.
services:
  - type: web
    name: necai-api
    runtime: python
    plan: free
    branch: master
    # Root directory is intentionally unset: `make` needs the repo root to see
    # the Makefile and the .cpp sources, and gunicorn resolves `api.app` from there.
    buildCommand: |
      pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      pip install -r requirements.txt
      make
      python -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='h4ng/necai', filename='openings/train-00000-of-00001.parquet', repo_type='dataset')"
    startCommand: gunicorn -w 1 -t 120 -b 0.0.0.0:$PORT api.app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Keep the HF cache inside the project dir so the opening book fetched at
      # build time is still present at runtime (free instances have no disk).
      - key: HF_HOME
        value: /opt/render/project/src/.hf
      # Depth 4 is ~4.6s on a full core, which times out on 0.1 CPU. Depth 3 is ~0.5s.
      - key: ENGINE_DEPTH
        value: "3"
